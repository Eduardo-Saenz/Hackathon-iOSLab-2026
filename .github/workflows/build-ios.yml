name: Build iOS & Upload to Appetize

on:
  push:
    branches: [main, clerkFeature]
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Aura

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available schemes
        run: xcodebuild -list -project Aura.xcodeproj

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project Aura.xcodeproj \
            -scheme Aura \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tail -50

      - name: Locate and Zip .app
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found"
            ls -R build/Build/Products/ || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/app.zip" "$(basename "$APP_PATH")"
          echo "APP_ZIP=$GITHUB_WORKSPACE/app.zip" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-ios-simulator
          path: app.zip
          retention-days: 14

      - name: Upload to Appetize.io
        if: ${{ env.APPETIZE_TOKEN != '' }}
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.appetize.io/v2/apps" \
            -H "Authorization: Bearer $APPETIZE_TOKEN" \
            -F "file=@$APP_ZIP" \
            -F "platform=ios")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            PUBLIC_KEY=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('publicKey',''))" 2>/dev/null || echo "")
            if [ -n "$PUBLIC_KEY" ]; then
              echo "## Appetize Preview" >> $GITHUB_STEP_SUMMARY
              echo "https://appetize.io/app/$PUBLIC_KEY" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "::warning::Appetize upload returned HTTP $HTTP_CODE"
          fi

      - name: Appetize not configured notice
        if: ${{ env.APPETIZE_TOKEN == '' }}
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        run: |
          echo "::notice::APPETIZE_TOKEN not set — build artifact saved but not uploaded to Appetize.io"
          echo "To enable Appetize preview: Settings → Secrets → New secret → APPETIZE_TOKEN"
