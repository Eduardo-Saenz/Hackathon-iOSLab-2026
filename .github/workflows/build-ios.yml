name: Build iOS & Upload to Appetize

on:
  push:
    branches: [main, clerkFeature]
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Aura

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available schemes
        run: xcodebuild -list -project Aura.xcodeproj

      - name: Build for Simulator
        run: |
          xcodebuild \
            -project Aura.xcodeproj \
            -scheme Aura \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tail -50

      - name: Locate and Zip .app
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app bundle not found"
            ls -R build/Build/Products/ || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/app.zip" "$(basename "$APP_PATH")"
          echo "APP_ZIP=$GITHUB_WORKSPACE/app.zip" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-ios-simulator
          path: app.zip
          retention-days: 14

      - name: Check Appetize token
        id: appetize_check
        run: |
          if [ -n "${{ secrets.APPETIZE_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::APPETIZE_TOKEN not set — build artifact saved. Add it in Settings → Secrets → Actions."
          fi

      - name: Upload to Appetize.io
        if: steps.appetize_check.outputs.has_token == 'true'
        uses: appetizeio/github-action-appetize@v1
        with:
          apiToken: ${{ secrets.APPETIZE_TOKEN }}
          appFile: app.zip
          platform: ios
